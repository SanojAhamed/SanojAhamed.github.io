name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Build (let angular.json decide outputPath)
      - name: Build Angular
        run: npx ng build --configuration production --base-href "/"

      # Find the folder that contains index.html under dist
      - name: Locate output folder
        id: out
        run: |
          OUT_DIR="$(dirname "$(find dist -type f -name index.html | head -n1)")"
          echo "OUT_DIR=$OUT_DIR" | tee -a $GITHUB_ENV
          [ -f "$OUT_DIR/index.html" ] || (echo "index.html not found" && exit 1)

      - name: Verify output
        run: ls -la "$OUT_DIR" && echo "------" && find "$OUT_DIR" -maxdepth 2 -type d -print

      - name: Include CNAME (custom domain)
        if: hashFiles('CNAME') != ''
        run: cp CNAME "$OUT_DIR"/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4